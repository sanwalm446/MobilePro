<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Vibrant Blue to Cyan Gradient for Main Ribbon -->
    <linearGradient id="mobiBlueCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Deep Blue/Purple Gradient for 3D Underfold Shadow -->
    <linearGradient id="mobiDeepFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B66" />
      <stop offset="50%" stop-color="#2546D0" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>

    <!-- Right Wing Gradient with Cyan Highlights -->
    <linearGradient id="mobiRightWing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0047FF" />
      <stop offset="60%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Pixel Tiles Gradient -->
    <linearGradient id="mobiPixelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0094FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Text Flow Gradient -->
    <linearGradient id="mobiFlowText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="60%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="mobiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0052FF" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 3D Ribbon 'M' Symbol -->
  <g filter="url(#mobiGlow)">
    <!-- Back Loop / Center Fold (Deep Purple-Blue) -->
    <path d="M190 140 C 235 230, 260 270, 275 240 C 290 210, 315 155, 335 150 C 355 145, 370 170, 355 210 C 335 260, 280 290, 240 260 C 205 235, 175 160, 190 140 Z" fill="url(#mobiDeepFold)" />

    <!-- Left Main Curved Ribbon Arm -->
    <path d="M115 190 C 115 110, 150 95, 195 145 L 245 210 C 230 240, 205 265, 175 270 C 130 275, 115 240, 115 190 Z" fill="url(#mobiBlueCyan)" />

    <!-- Left Inner Twist & Depth -->
    <path d="M125 185 C 130 130, 160 115, 190 155 C 160 195, 140 225, 125 185 Z" fill="#003ACC" opacity="0.4" />

    <!-- Right Flowing Swoop & Dynamic Curve -->
    <path d="M230 220 C 275 160, 310 115, 360 140 C 390 155, 385 195, 365 245 C 340 300, 305 285, 290 250 C 270 205, 245 210, 230 220 Z" fill="url(#mobiRightWing)" />

    <!-- Floating Digital Pixel Tiles / Diamonds (Top Right) -->
    <!-- Tile 1 (Upper Right) -->
    <polygon points="390,95 420,80 435,108 405,123" fill="url(#mobiPixelGrad)" rx="3" />
    
    <!-- Tile 2 (Middle Right) -->
    <polygon points="360,118 390,105 402,128 372,141" fill="url(#mobiPixelGrad)" rx="3" />
    
    <!-- Tile 3 (Lower Right) -->
    <polygon points="392,135 422,122 434,145 404,158" fill="url(#mobiPixelGrad)" rx="3" />
  </g>

  <!-- Wordmark: MOBIFLOW -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="64" letter-spacing="-1">
    <text x="75" y="380" fill="#0A192F">Mobi</text>
    <text x="235" y="380" fill="url(#mobiFlowText)">flow</text>
  </g>

  <!-- Subtitle Divider Lines & SOFTWARE Text -->
  <g>
    <!-- Left Divider Line -->
    <line x1="75" y1="418" x2="165" y2="418" stroke="#0066FF" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- S O F T W A R E -->
    <text x="250" y="424" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" letter-spacing="11" fill="#0A192F">SOFTWARE</text>
    
    <!-- Right Divider Line -->
    <line x1="335" y1="418" x2="425" y2="418" stroke="#0066FF" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
